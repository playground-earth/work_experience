<style>
/* Layout: fixed left nav with collapsible Skills and Experience groups, content pane with tile grids on home and detail pages per skill and job. Palette: cool grays with one working green. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --side: #e9edeb;
  --ink: #18201c;
  --muted: #55645c;
  --line: #d3dbd7;
  --accent: #1b7a4b;
  --accent-ink: #ffffff;
  --accent-soft: #e0f0e7;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --side: #151c19; --ink: #e5ece8; --muted: #9aa8a0;
    --line: #28332e; --accent: #4cc38a; --accent-ink: #0c1411; --accent-soft: #1b3228;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --side: #151c19; --ink: #e5ece8; --muted: #9aa8a0;
  --line: #28332e; --accent: #4cc38a; --accent-ink: #0c1411; --accent-soft: #1b3228;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 296px minmax(0, 1fr); min-height: 100vh; }

/* Side nav */
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.brand { display: block; text-decoration: none; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.home-link { display: block; padding: 7px 10px; border-radius: 4px; text-decoration: none; font-size: 14px; color: var(--muted); }
.grp { margin-top: 10px; }
.grp-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px 10px; cursor: pointer; text-align: left; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; border-radius: 4px; }
.grp-btn .sign { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; font-size: 14px; line-height: 1; }
.grp ul { list-style: none; margin: 2px 0 0; padding: 0 0 0 18px; }
.grp ul[hidden] { display: none; }
.nav-link { display: block; padding: 6px 10px; border-radius: 4px; text-decoration: none; font-size: 14px; color: var(--muted); border-left: 2px solid transparent; }
.nav-link:hover, .home-link:hover, .grp-btn:hover { background: var(--accent-soft); color: var(--ink); }
.nav-link[aria-current="page"], .home-link[aria-current="page"] { color: var(--ink); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.home-link[aria-current="page"] { border-left: 2px solid var(--accent); }

.topbar { display: none; }

/* Content */
.main { min-width: 0; padding-block: 48px 72px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
h1 { font-size: clamp(32px, 4.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 14px; font-weight: 700; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h3 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
.lede { font-size: 18px; color: var(--muted); max-width: 66ch; margin: 0 0 20px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding: 12px 0; border-block: 1px solid var(--line); margin: 0 0 36px; }
.facts b { color: var(--ink); font-weight: 500; }

details.sec { border-top: 1px solid var(--line); padding-block: 8px 20px; margin-top: 8px; }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 0; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .sign { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; font-size: 16px; line-height: 1; flex: none; }
details.sec > summary .sign::before { content: "+"; }
details.sec[open] > summary .sign::before { content: "\2212"; }
details.sec > summary .count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 10px; }
.tile { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; text-decoration: none; min-width: 0; transition: border-color .15s, background .15s; }
.tile:hover { border-color: var(--accent); }
.tile .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.tile h3 { font-size: 18px; margin: 0; }
.tile p { margin: 0; color: var(--muted); font-size: 14.5px; }
.tile .go { margin-top: auto; padding-top: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
.tile:hover .go { color: var(--accent); }

.crumbs { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--accent); }

ul.plain { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.plain li { padding-left: 18px; position: relative; max-width: 74ch; }
ul.plain li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 8px; height: 1px; background: var(--accent); }
.cards { display: grid; gap: 14px; margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; min-width: 0; }
.card .where { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card .where a { color: var(--accent); text-decoration: none; }
.card .where a:hover { text-decoration: underline; }
.card p { margin: 0 0 8px; max-width: 74ch; }
.card .out { margin: 10px 0 0; padding: 8px 12px; background: var(--accent-soft); border-radius: 3px; font-size: 14.5px; }
.card .out b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }

.value { display: grid; gap: 10px; margin: 6px 0 22px; }
.value div { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; font-size: 17px; font-weight: 500; }
.group { margin-top: 14px; }
.group h3 { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.item { padding: 10px 0; border-bottom: 1px solid var(--line); max-width: 78ch; }
.item:last-child { border-bottom: 0; }
.item b { font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px; text-decoration: none; background: var(--surface); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--side); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar b { font-size: 16px; }
  .menu-btn { background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 6px 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }
  .side { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side.open { display: block; }
  .main { padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lede { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

var JOB_BY_ID = {}, SKILL_BY_ID = {};
JOBS.forEach(function (j) { JOB_BY_ID[j.id] = j; });
SKILLS.forEach(function (s) { SKILL_BY_ID[s.id] = s; });

var openState = { skills: true, exp: true };

function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

function buildNav() {
  var side = document.getElementById('side');
  var html = '<a class="brand" href="#home"><b>Fernanda Dorsey</b><span>Product Manager, generalist</span></a>' +
    '<a class="home-link" href="#home" data-route="home">Home</a>' +
    group('skills', 'Skills', SKILLS.map(function (s) { return link('skill-' + s.id, s.name); })) +
    group('exp', 'Experience', JOBS.map(function (j) { return link('job-' + j.id, j.org); }));
  side.innerHTML = html;
  Array.prototype.forEach.call(side.querySelectorAll('.grp-btn'), function (b) {
    b.addEventListener('click', function () {
      var key = b.getAttribute('data-key');
      openState[key] = !openState[key];
      syncGroups();
    });
  });
  syncGroups();
}
function link(route, label) { return '<li><a class="nav-link" href="#' + route + '" data-route="' + route + '">' + label + '</a></li>'; }
function group(key, label, items) {
  return '<div class="grp"><button class="grp-btn" data-key="' + key + '" aria-expanded="true" aria-controls="g-' + key + '"><span class="sign">−</span>' + label + '</button><ul id="g-' + key + '">' + items.join('') + '</ul></div>';
}
function syncGroups() {
  Array.prototype.forEach.call(document.querySelectorAll('.grp-btn'), function (b) {
    var key = b.getAttribute('data-key'), open = openState[key];
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.querySelector('.sign').textContent = open ? '−' : '+';
    document.getElementById('g-' + key).hidden = !open;
  });
}

function chipLinks(ids) {
  return '<div class="chips">' + ids.map(function (id) { var s = SKILL_BY_ID[id]; return '<a class="chip" href="#skill-' + id + '">' + s.name + '</a>'; }).join('') + '</div>';
}

function sec(title, count, inner) {
  return '<details class="sec" open><summary><span class="sign"></span><h2>' + title + '</h2>' + (count ? '<span class="count">' + count + '</span>' : '') + '</summary>' + inner + '</details>';
}

function renderHome() {
  var skillTiles = SKILLS.map(function (s) {
    return '<a class="tile" href="#skill-' + s.id + '"><span class="kicker">' + s.kicker + '</span><h3>' + s.name + '</h3><p>' + s.blurb + '</p><span class="go">View details and examples →</span></a>';
  }).join('');
  var jobTiles = JOBS.map(function (j) {
    return '<a class="tile" href="#job-' + j.id + '"><span class="kicker">' + j.dates + '</span><h3>' + j.org + '</h3><p><b>' + j.role.split(' | ')[0] + '</b></p><p>' + j.blurb + '</p><span class="go">View role →</span></a>';
  }).join('');
  return '<p class="eyebrow">Portfolio</p><h1>Fernanda Dorsey</h1>' +
    '<p class="lede">Sr. Technical &amp; Digital Product Manager who has led e-commerce, internet, and IT platform migrations and digital transformation programs across hardware, SaaS, and software. Uses AI across discovery, PRDs, and development, and on financial and user data to build business cases that turn potential value into realized value.</p>' +
    '<div class="facts"><span><b>$300M+</b> incremental revenue</span><span><b>5</b> product roles</span><span><b>2007</b> to present</span></div>' +
    sec('Skills', SKILLS.length + ' areas', '<div class="tiles">' + skillTiles + '</div>') +
    sec('Experience', JOBS.length + ' roles', '<div class="tiles">' + jobTiles + '</div>');
}

function renderSkill(id) {
  var s = SKILL_BY_ID[id]; if (!s) return renderHome();
  var does = '<ul class="plain">' + s.does.map(function (d) { return '<li>' + d + '</li>'; }).join('') + '</ul>';
  var ex = '<div class="cards">' + s.examples.map(function (e) {
    var j = JOB_BY_ID[e.job];
    return '<div class="card"><div class="where"><a href="#job-' + j.id + '">' + j.org + '</a> · ' + j.dates + '</div><h3>' + e.title + '</h3><p>' + e.body + '</p><div class="out"><b>Result</b>' + e.out + '</div></div>';
  }).join('') + '</div>';
  return '<div class="crumbs"><a href="#home">Home</a> / Skills / ' + s.name + '</div>' +
    '<p class="eyebrow">' + s.kicker + '</p><h1>' + s.name + '</h1><p class="lede">' + s.lede + '</p>' +
    sec('What I do', '', does) +
    sec('Examples', s.examples.length + ' examples', ex);
}

function renderJob(id) {
  var j = JOB_BY_ID[id]; if (!j) return renderHome();
  var value = '<div class="value">' + j.value.map(function (v) { return '<div>' + v + '</div>'; }).join('') + '</div>';
  var details = j.groups.map(function (g) {
    return '<div class="group"><h3>' + g.name + '</h3>' + g.items.map(function (i) { return '<div class="item"><b>' + i[0] + '.</b> ' + i[1] + '</div>'; }).join('') + '</div>';
  }).join('');
  return '<div class="crumbs"><a href="#home">Home</a> / Experience / ' + j.org + '</div>' +
    '<p class="eyebrow">' + j.dates + ' · ' + j.where + '</p><h1>' + j.role.split(' | ')[0] + '</h1>' +
    '<p class="lede"><b>' + j.org + '.</b> ' + j.summary + '</p>' +
    sec('Value delivered', '', value) +
    sec('Details', '', details) +
    sec('Skills used', '', chipLinks(j.skills));
}

function route() {
  var h = (location.hash || '#home').slice(1), view = document.getElementById('view');
  if (h.indexOf('skill-') === 0) view.innerHTML = renderSkill(h.slice(6));
  else if (h.indexOf('job-') === 0) view.innerHTML = renderJob(h.slice(4));
  else { h = 'home'; view.innerHTML = renderHome(); }
  Array.prototype.forEach.call(document.querySelectorAll('[data-route]'), function (a) {
    if (a.getAttribute('data-route') === h) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (h.indexOf('skill-') === 0) openState.skills = true;
  if (h.indexOf('job-') === 0) openState.exp = true;
  syncGroups();
  document.getElementById('side').classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}

document.getElementById('menuBtn').addEventListener('click', function () {
  var side = document.getElementById('side'), open = side.classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
});
window.addEventListener('hashchange', route);
buildNav();
route();
</script>
